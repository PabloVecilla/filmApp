# docker-compose.test.yml
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filmapp_test
      POSTGRES_PASSWORD: filmapp_test
      POSTGRES_DB: filmapp_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmapp_test -d filmapp_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  mongo-test:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - mongo-test-data:/data/db

  test-runner:
    image: node:22-alpine
    working_dir: /app
    environment:
      NODE_ENV: test
      POSTGRES_URI_TEST: postgres://filmapp_test:filmapp_test@postgres-test:5432/filmapp_test
      MONGO_URI_TEST: mongodb://mongo-test:27017/filmapp_test
      DB_SSL: "false"
      ACCESS_TOKEN_SECRET: test-only-secret
      OMDB_API_KEY: test-key
      PORT: "3001"
    volumes:
      - .:/app
      - test-node-modules:/app/node_modules
    depends_on:
      postgres-test:
        condition: service_healthy
      mongo-test:
        condition: service_healthy
    command: >
      sh -c "npm ci &&
             npm run db:migrate:test &&
             npm run test:jest"

volumes:
  postgres-test-data:
  mongo-test-data:
  test-node-modules: