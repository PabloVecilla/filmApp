name: Backend CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

permissions: 
    contents: read

jobs:
  backend-checks:
    name: Migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: filmapp_test
          POSTGRES_PASSWORD: filmapp_test
          POSTGRES_DB: filmapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U filmapp_test -d filmapp_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

      mongo: 
        image: mongo:7
        ports: 
            - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test

      POSTGRES_URI_TEST: postgres://filmapp_test:filmapp_test@127.0.0.1:5432/filmapp_test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/filmapp_test
      DB_SSL: "false"

      ACCESS_TOKEN_SECRET: ci-test-only-secret
      OMDB_API_KEY: test-key
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug files
        run: ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
    
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run test database migrations
        run: npm run db:migrate:test

      - name: Run Jest tests
        run: npm run test:jest